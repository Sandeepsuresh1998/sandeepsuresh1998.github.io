{{ define "main" }}
<article class="page-shell">
  <header class="page-heading">
    {{ with .Params.kicker }}<p class="eyebrow">{{ . }}</p>{{ end }}
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  </header>

  <div class="content-body">
    {{ .Content }}
  </div>
</article>
{{ end }}
